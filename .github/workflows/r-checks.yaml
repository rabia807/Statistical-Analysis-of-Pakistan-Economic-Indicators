name: R project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Install dependencies
        run: |
          install.packages(c("shiny", "WDI", "dplyr", "ggplot2", "DT", "scales", "testthat"))
        shell: Rscript {0}
      - name: Parse R source files
        run: |
          parse(file = "app.R")
          parse(file = "R/data.R")
          parse(file = "requirements.R")
          parse(file = "tests/testthat/test-data.R")
        shell: Rscript {0}
      - name: Run unit tests
        run: testthat::test_dir("tests/testthat")
        shell: Rscript {0}
